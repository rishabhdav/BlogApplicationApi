spring.application.name=blog

# Server
server.port=${PORT:8080}

# Database connection (Render injects these as env vars from the Postgres instance)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blog}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (add these once Spring Security + JWT are wired in - see note in chat)
jwt.secret=${JWT_SECRET:change-me-in-production}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Actuator - expose only /health publicly, with details hidden unless authorized
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging - console only (Render captures stdout), no file appenders configured
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
